<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#dce9d4">
<title>趙桂英｜健康講座講師</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;600&display=swap');
:root{--deep:#284b3c;--moss:#647e5e;--sage:#a9bd9e;--paper:#f4f5e9;--gold:#d4b879}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:28px;background:#e8eee2;color:var(--deep);font-family:'Noto Serif TC',serif}
.card{width:min(100%,900px);aspect-ratio:1.72;position:relative;overflow:hidden;border-radius:24px;background:linear-gradient(112deg,#cedfc5 0%,#e5ebd7 43%,#b7c9ac 100%);box-shadow:0 30px 90px #314c382c,0 2px 5px #314c381c;isolation:isolate}
/* layered forest silhouettes */
.forest{position:absolute;inset:0;z-index:-2;overflow:hidden;background:radial-gradient(ellipse at 77% 56%,#f7f4d9a6 0%,#f1f0d26b 17%,transparent 41%),linear-gradient(90deg,#dce8d4 0%,#e8edd9b0 53%,#c2d3b7 100%)}
.forest:before{content:"";position:absolute;inset:-12% -4% 0 30%;opacity:.52;background:repeating-linear-gradient(75deg,transparent 0 88px,#fbf6d940 89px 96px,transparent 98px 154px),repeating-linear-gradient(105deg,transparent 0 125px,#708c6c20 127px 138px,transparent 140px 200px);filter:blur(1px)}
.sunbeam{position:absolute;z-index:-1;top:-55%;left:49%;width:29%;height:175%;transform:rotate(31deg);background:linear-gradient(90deg,transparent,#fffde466 35%,#fff9d830 68%,transparent);filter:blur(9px);opacity:.9}
.tree{position:absolute;bottom:-5%;width:25%;height:90%;opacity:.3;filter:blur(1px)}.tree.left{left:-6%;}.tree.right{right:-5%;transform:scaleX(-1);opacity:.24}.trunk{position:absolute;bottom:0;left:45%;width:10%;height:100%;background:linear-gradient(90deg,#718b70,#8fa784,#617d65);clip-path:polygon(38% 0,68% 0,61% 31%,83% 58%,68% 62%,58% 100%,38% 100%,45% 60%,19% 39%,31% 34%)}.leaf{position:absolute;background:#829e79;border-radius:60% 10% 60% 10%;transform:rotate(-35deg);width:52%;height:19%;left:5%;top:19%;box-shadow:34px 46px 0 -7px #829e79,58px -36px 0 -11px #829e79}.leaf.two{left:42%;top:36%;transform:scaleX(-1) rotate(-35deg);width:50%;height:17%;background:#94aa84;box-shadow:-27px 45px 0 -6px #94aa84,30px -37px 0 -11px #94aa84}
.card:after{content:"";position:absolute;inset:17px;border:1px solid #fff9e4a6;border-radius:15px;pointer-events:none}.content{position:absolute;inset:0;padding:8.2% 9.3%;display:flex;flex-direction:column;justify-content:center}.eyebrow{display:flex;align-items:center;gap:12px;color:#59765c;font:600 11px 'DM Sans',sans-serif;letter-spacing:.24em;text-transform:uppercase}.eyebrow:before{content:"";width:34px;height:1px;background:#a38b56}.name{font-size:clamp(39px,7vw,68px);font-weight:600;letter-spacing:.16em;line-height:1.2;margin:22px 0 5px;color:#294b3b;text-shadow:0 2px 20px #ffffff56}.degree{font:500 clamp(13px,1.7vw,17px) 'DM Sans','Noto Serif TC',sans-serif;letter-spacing:.27em;color:#688065;margin-left:4px}.rule{width:54px;height:1px;background:var(--gold);margin:25px 0 19px}.tagline{font-size:clamp(17px,2.5vw,24px);letter-spacing:.16em;color:#405d49;font-weight:500}.role{margin-top:10px;color:#657d64;font-size:14px;letter-spacing:.16em}.bottom{position:absolute;left:9.3%;right:9.3%;bottom:8.5%;display:flex;align-items:center;justify-content:space-between;color:#637b62;font:10px 'DM Sans',sans-serif;letter-spacing:.18em}.seal{width:38px;height:38px;border:1px solid #a98850aa;border-radius:50%;display:grid;place-items:center;color:#a1814d;font:500 12px 'Noto Serif TC';letter-spacing:.1em;background:#f5efd94d}
@media(max-width:560px){body{padding:15px}.card{aspect-ratio:.9;border-radius:20px}.content{padding:12% 9% 23%;justify-content:flex-start;padding-top:24%}.name{margin-top:25px;font-size:clamp(38px,12vw,58px)}.bottom{bottom:8%}.tree{width:37%;height:72%}.card:after{inset:12px}}
@media print{body{padding:0;background:white}.card{box-shadow:none;width:90vw;-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
</head>
<body>
<main class="card" aria-label="趙桂英健康講座名片">
  <div class="forest" aria-hidden="true"></div><div class="sunbeam" aria-hidden="true"></div>
  <div class="tree left" aria-hidden="true"><i class="trunk"></i><i class="leaf"></i><i class="leaf two"></i></div><div class="tree right" aria-hidden="true"><i class="trunk"></i><i class="leaf"></i><i class="leaf two"></i></div>
  <div class="content">
    <div class="eyebrow">WELLNESS · IN HARMONY WITH NATURE</div>
    <h1 class="name">趙桂英</h1>
    <div class="degree">醫學博士　·　Ph.D.</div>
    <div class="rule"></div>
    <div class="tagline">不開藥的處方箋</div>
    <div class="role">健康講座講師</div>
  </div>
  <div class="bottom"><span>讓健康，從日常生活裡慢慢發生</span><span class="seal">自然<br>養心</span></div>
</main>
</body>
</html>
